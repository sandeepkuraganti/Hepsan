<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Valentine ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #d90429;
            --soft-white: rgba(255, 255, 255, 0.85);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        #bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('us-main.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(8px);
            z-index: -2;
            transition: background-image 0.5s ease-in-out;
        }

        .white-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            z-index: -1;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .content-card {
            background: var(--soft-white);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.5);
            position: relative; /* Essential for relative button movement */
            text-align: center;
        }

        .display-photo {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--primary-red);
            font-size: 2.2rem;
            margin: 10px 0;
            min-height: 80px;
        }

        .btn-group {
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 20px;
            min-height: 60px;
        }

        .btn {
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        #yesBtn {
            background: var(--primary-red);
            color: white;
        }

        #noBtn {
            background: #e9ecef;
            color: #495057;
            position: relative; /* Relative inside the group initially */
            transition: all 0.1s ease; /* Faster jump response */
        }

        .telugu-msg {
            font-size: 1.3rem;
            margin-top: 1rem;
            line-height: 1.6;
        }

        .heart-particle {
            position: fixed;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="bg-image"></div>
    <div class="white-overlay"></div>

    <div class="main-container">
        <div class="content-card" id="card">
            <img src="us-main.jpg" id="mainPhoto" class="display-photo">
            <h1 id="question">Will you be my Valentine?</h1>
            
            <div class="btn-group">
                <button class="btn" id="yesBtn">Yes!</button>
                <button class="btn" id="noBtn">No</button>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 0;
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const card = document.getElementById('card');
        const questionText = document.getElementById('question');
        const mainPhoto = document.getElementById('mainPhoto');
        const bgImage = document.getElementById('bg-image');

        const contentSteps = [
            { photo: 'us-recent.jpg', question: 'Dont you want to be my Valentine? 😢' },
            { photo: 'us-first.jpg', question: 'Still dont want to be my Valentine?' },
            { photo: 'me.jpg', question: 'Last warning, click Yes! 😤' }
        ];

        noBtn.addEventListener('click', () => {
            if (currentStep < contentSteps.length) {
                const step = contentSteps[currentStep];
                mainPhoto.src = step.photo;
                questionText.innerText = step.question;
                bgImage.style.backgroundImage = `url('${step.photo}')`;
                
                currentStep++;

                if (currentStep === 3) {
                    noBtn.style.backgroundColor = "#d90429";
                    noBtn.style.color = "white";
                }
            }
        });

        // Moves the button ONLY within the bounds of the card
        const moveButton = () => {
            if (currentStep === 3) {
                const cardRect = card.getBoundingClientRect();
                const btnWidth = noBtn.offsetWidth;
                const btnHeight = noBtn.offsetHeight;

                // Calculate random position restricted to the card boundaries
                // We use absolute positioning relative to the card
                const x = Math.random() * (cardRect.width - btnWidth);
                const y = Math.random() * (cardRect.height - btnHeight);
                
                noBtn.style.position = 'absolute';
                noBtn.style.left = `${x}px`;
                noBtn.style.top = `${y}px`;
                noBtn.style.margin = '0';
            }
        };

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveButton(); });

        yesBtn.addEventListener('click', () => {
            card.innerHTML = `
                <img src="us-final.jpg" class="display-photo">
                <h1>I Knew It! ❤️</h1>
                <p class="telugu-msg">నాకు తెలుసు నువ్వు నాకు నో చెప్పలేవని... <br> <strong>I Love You!</strong></p>
            `;
            bgImage.style.backgroundImage = "url('us-final.jpg')";
            bgImage.style.filter = "blur(10px)";
            startHearts();
        });

        function startHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 4000);
            }, 150);
        }
    </script>
</body>
</html>
