<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Valentine ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #d90429;
            --soft-white: rgba(255, 255, 255, 0.85);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        #bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('us-main.jpg');
            background-size: cover; background-position: center;
            filter: blur(8px); z-index: -2;
            transition: background-image 0.5s ease-in-out;
        }

        .white-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.4); z-index: -1;
        }

        .main-container {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; padding: 20px;
        }

        .content-card {
            background: var(--soft-white);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 450px; width: 90%;
            border: 1px solid rgba(255,255,255,0.5);
            position: relative;
            text-align: center;
        }

        .display-photo {
            width: 100%; height: 280px; object-fit: cover;
            border-radius: 20px; margin-bottom: 1.5rem;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--primary-red);
            font-size: 2.2rem; margin: 10px 0; min-height: 80px;
        }

        .btn-group {
            margin-top: 1.5rem; display: flex;
            justify-content: center; gap: 20px; min-height: 60px;
        }

        .btn {
            padding: 12px 35px; font-size: 1.1rem; font-weight: 600;
            border-radius: 50px; border: none; cursor: pointer;
            transition: all 0.2s;
        }

        #yesBtn { background: var(--primary-red); color: white; }
        #noBtn { background: #e9ecef; color: #495057; position: relative; }

        /* The "Don't Act Smart" Popup */
        #smartPopup {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(217, 4, 41, 0.95);
            color: white;
            padding: 1.5rem;
            border-radius: 20px;
            z-index: 100;
            width: 80%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            font-weight: 600;
        }

        .telugu-msg { font-size: 1.3rem; margin-top: 1rem; line-height: 1.6; }
        .heart-particle { position: fixed; pointer-events: none; animation: floatUp 4s linear forwards; }
