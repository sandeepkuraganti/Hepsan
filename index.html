<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Valentine ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #d90429;
            --soft-white: rgba(255, 255, 255, 0.85);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        /* The blurred background effect */
        #bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('us-main.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(8px);
            z-index: -2;
            transition: background-image 0.5s ease-in-out;
        }

        /* The professional white overlay */
        .white-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            z-index: -1;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .content-card {
            background: var(--soft-white);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .display-photo {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--primary-red);
            font-size: 2.5rem;
            margin: 10px 0;
        }

        .btn-group {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 20px;
            min-height: 50px;
        }

        .btn {
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #yesBtn {
            background: var(--primary-red);
            color: white;
            box-shadow: 0 4px 15px rgba(217, 4, 41, 0.3);
        }

        #noBtn {
            background: #e9ecef;
            color: #495057;
            position: relative;
        }

        /* Telugu text styling */
        .telugu-msg {
            font-size: 1.2rem;
            margin-top: 1rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="bg-image"></div>
    <div class="white-overlay"></div>

    <div class="main-container">
        <div class="content-card" id="card">
            <img src="us-main.jpg" id="mainPhoto" class="display-photo">
            <h1 id="question">Will you be my Valentine?</h1>
            
            <div class="btn-group">
                <button class="btn" id="yesBtn">Yes!</button>
                <button class="btn" id="noBtn">No</button>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 0;
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionText = document.getElementById('question');
        const mainPhoto = document.getElementById('mainPhoto');
        const bgImage = document.getElementById('bg-image');

        const contentSteps = [
            {
                photo: 'us-recent.jpg',
                question: 'Dont you want to be my Valentine? 😢',
                run: false
            },
            {
                photo: 'us-first.jpg',
                question: 'Still dont want to be my Valentine?',
                run: false
            },
            {
                photo: 'me.jpg',
                question: 'Last warning, click Yes! 😤',
                run: true
            }
        ];

        // "No" Button Logic
        noBtn.addEventListener('click', () => {
            if (currentStep < contentSteps.length) {
                const step = contentSteps[currentStep];
                mainPhoto.src = step.photo;
                questionText.innerText = step.question;
                
                // Keep the background slightly synced
                bgImage.style.backgroundImage = `url('${step.photo}')`;
                
                currentStep++;
            }
        });

        // "No" Button Runaway Logic
        const moveButton = () => {
            if (currentStep === 3) { // Only run on the "Last Warning" step
                const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
                const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
                noBtn.style.position = 'fixed';
                noBtn.style.left = `${x}px`;
                noBtn.style.top = `${y}px`;
            }
        };

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', moveButton);

        // "Yes" Button Logic
        yesBtn.addEventListener('click', () => {
            document.getElementById('card').innerHTML = `
                <img src="us-final.jpg" class="display-photo">
                <h1>I Knew It! ❤️</h1>
                <p class="telugu-msg">నాకు తెలుసు నువ్వు నాకు నో చెప్పలేవని... <br> <strong>I Love You!</strong></p>
            `;
            // Reset background to a clean happy look
            bgImage.style.backgroundImage = "url('us-final.jpg')";
            bgImage.style.filter = "blur(4px)";
        });
    </script>
</body>
</html>
