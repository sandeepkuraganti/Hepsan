<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For My Valentine ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #d90429;
            --overlay-dark: rgba(0, 0, 0, 0.55);
            --glass: rgba(255, 255, 255, 0.1);
        }

        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #1a1a1a; /* Dark gray instead of pure black for better feel */
            font-family: 'Montserrat', sans-serif;
            touch-action: manipulation;
        }

        #bg-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; overflow: hidden; }
        
        #bg-image {
            width: 100%; height: 100%;
            background-image: url('us-main.png');
            background-size: cover; background-position: center;
            animation: kenBurns 25s infinite alternate ease-in-out;
            transition: background-image 1.2s ease-in-out;
            /* Performance: Hardware acceleration */
            will-change: transform;
        }

        @keyframes kenBurns { 0% { transform: scale(1); } 100% { transform: scale(1.12); } }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--overlay-dark); z-index: 2; }
        
        /* Particle System Optimization */
        #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
        .petal {
            position: absolute;
            background: linear-gradient(to bottom right, #ff5e7e, #ffc3a0);
            border-radius: 150% 0 150% 0;
            opacity: 0.5;
            will-change: transform;
            animation: fallRotate linear infinite;
        }
        @keyframes fallRotate { to { transform: translateY(120vh) rotate(720deg); } }

        /* Login Screen */
        #loginScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000; transition: opacity 0.8s ease;
        }
        .login-card {
            background: var(--glass); backdrop-filter: blur(20px); padding: 2.5rem; border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2); text-align: center; color: white; width: 85%; max-width: 350px;
        }
        .login-card h2 { font-family: 'Dancing Script', cursive; font-size: clamp(1.4rem, 5vw, 2.1rem); margin-bottom: 1.5rem; line-height: 1.4; }
        
        input#pinInput {
            width: 100%; padding: 15px; box-sizing: border-box; font-size: 1.5rem; border-radius: 15px; border: none;
            text-align: center; letter-spacing: 10px; margin-bottom: 1.5rem; background: rgba(255,255,255,0.9);
        }

        .ui-layer {
            position: relative; z-index: 10; height: 100vh; display: none;
            flex-direction: column; justify-content: center; align-items: center; text-align: center;
            padding: 20px; color: white;
        }
        h1 { font-family: 'Dancing Script', cursive; font-size: clamp(2.2rem, 8vw, 4.2rem); margin-bottom: 20px; text-shadow: 2px 4px 15px rgba(0,0,0,0.8); line-height: 1.2; }
        .sub-desc { font-family: 'Dancing Script', cursive; font-size: clamp(1.3rem, 3vw, 2.2rem); margin-bottom: 30px; text-shadow: 2px 4px 15px rgba(0,0,0,0.8); line-height: 1.2; padding: 0 10px; }

        .btn-group { display: flex; gap: 25px; align-items: flex-start; justify-content: center; }
        .btn-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; }
