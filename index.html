<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Valentine ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #d90429;
            --soft-white: rgba(255, 255, 255, 0.9);
        }

        /* Forces the background to occupy the full browser window */
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000; /* Black fallback for better contrast */
        }

        #bg-image {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-image: url('us-main.jpg');
            background-size: cover; /* This makes the image fill the screen */
            background-position: center;
            filter: blur(8px) brightness(0.8); /* Soft blur + slightly dark for readability */
            z-index: -2;
            transition: background-image 0.8s ease-in-out;
        }

        .white-overlay {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.3); /* Transparent white layer */
            z-index: -1;
        }

        .main-container {
            display: flex; justify-content: center; align-items: center;
            width: 100vw; height: 100vh;
        }

        .content-card {
            background: var(--soft-white);
            backdrop-filter: blur(15px);
            padding: 2.5rem; border-radius: 30px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.3);
            max-width: 420px; width: 90%;
            border: 1px solid rgba(255,255,255,0.5);
            position: relative; text-align: center;
        }

        .display-photo {
            width: 100%; height: 260px; object-fit: cover;
            border-radius: 20px; margin-bottom: 1.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--primary-red);
            font-size: 2.2rem; margin: 10px 0; min-height: 80px;
        }

        .btn-group {
            margin-top: 1.5rem; display: flex;
            justify-content: center; gap: 20px; min-height: 60px;
        }

        .btn {
            padding: 12px 35px; font-size: 1.1rem; font-weight: 600;
            border-radius: 50px; border: none; cursor: pointer;
            transition: all 0.2s;
        }

        #yesBtn { background: var(--primary-red); color: white; z-index: 10; }
        #noBtn { background: #e9ecef; color: #495057; position: relative; z-index: 5; }

        /* "Don't Act Smart" Popup */
        #smartPopup {
            display: none; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(217, 4, 41, 0.95); color: white;
            padding: 1.5rem; border-radius: 20px; z-index: 100;
            width: 80%; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            font-weight: 600;
        }

        .telugu-msg { font-size: 1.3rem; margin-top: 1rem; line-height: 1.6; color: #333; }
        .heart-particle { position: fixed; pointer-events: none; animation: floatUp 4s linear forwards; }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="bg-image"></div>
    <div class="white-overlay"></div>

    <div class="main-container">
        <div class="content-card" id="card">
            <div id="smartPopup">Dont act smart! <br> You only have option that is YES! 😉</div>
            <img src="us-main.jpg" id="mainPhoto" class="display-photo">
            <h1 id="question">Will you be my Valentine?</h1>
            
            <div class="btn-group">
                <button class="btn" id="yesBtn">Yes!</button>
                <button class="btn" id="noBtn">No</button>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 0;
        let noAvoidCount = 0;
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const card = document.getElementById('card');
        const popup = document.getElementById('smartPopup');
        const questionText = document.getElementById('question');
        const mainPhoto = document.getElementById('mainPhoto');
        const bgImage = document.getElementById('bg-image');

        const contentSteps = [
            { photo: 'us-recent.jpg', question: 'Dont you want to be my Valentine? 😢' },
            { photo: 'us-first.jpg', question: 'Still dont want to be my Valentine?' },
            { photo: 'me.jpg', question: 'Last warning, click Yes! 😤' }
        ];

        noBtn.addEventListener('click', () => {
            if (currentStep < contentSteps.length) {
                const step = contentSteps[currentStep];
                mainPhoto.src = step.photo;
                questionText.innerText = step.question;
                
                // This line updates the full-screen background image
                bgImage.style.backgroundImage = `url('${step.photo}')`;
                
                currentStep++;
                if (currentStep === 3) {
                    noBtn.style.backgroundColor = "#d90429";
                    noBtn.style.color = "white";
                }
            }
        });

        const moveButton = () => {
            if (currentStep === 3) {
                noAvoidCount++;
                if (noAvoidCount >= 2) {
                    popup.style.display = 'block';
                    setTimeout(() => { popup.style.display = 'none'; }, 3000);
                }
                const cardRect = card.getBoundingClientRect();
                const x = Math.random() * (cardRect.width - noBtn.offsetWidth);
                const y = Math.random() * (cardRect.height - noBtn.offsetHeight);
                noBtn.style.position = 'absolute';
                noBtn.style.left = `${x}px`;
                noBtn.style.top = `${y}px`;
                noBtn.style.margin = '0';
            }
        };

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveButton(); });

        yesBtn.addEventListener('click', () => {
            card.innerHTML = `
                <img src="us-final.jpg" class="display-photo">
                <h1>I Knew It! ❤️</h1>
                <p class="telugu-msg">నాకు తెలుసు నువ్వు నాకు నో చెప్పలేవని... <br> <strong>I Love You!</strong></p>
            `;
            bgImage.style.backgroundImage = "url('us-final.jpg')";
            bgImage.style.filter = "blur(12px) brightness(0.7)";
            startHearts();
        });

        function startHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 4000);
            }, 150);
        }
    </script>
</body>
</html>
